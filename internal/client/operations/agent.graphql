# Get tools for a specific agent
query GetAgentTools($aspectId: ID!, $agentId: ID!) {
  organization {
    id
    aspect(id: $aspectId) {
      ... on AspectApp {
        agentV2(id: $agentId) {
          ... on AgentElementum {
            tools {
              edges {
                node {
                  ...AgentToolInfo
                }
              }
            }
          }
          ... on AgentSnowflake {
            tools {
              edges {
                node {
                  ...AgentToolInfo
                }
              }
            }
          }
          ... on AgentBedrock {
            tools {
              edges {
                node {
                  ...AgentToolInfo
                }
              }
            }
          }
          ... on AgentBrowserUse {
            tools {
              edges {
                node {
                  ...AgentToolInfo
                }
              }
            }
          }
        }
      }
    }
  }
}
