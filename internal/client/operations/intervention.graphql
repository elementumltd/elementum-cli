# Intervention queries for automation health monitoring

query GetAspectInterventions(
  $aspectId: ID!
  $filter: Filter
  $sort: Sort
  $first: Int
  $after: String
) {
  organization {
    aspect(id: $aspectId) {
      id
      name
      __typename
      ... on AspectApp {
        health {
          automations {
            interventions(filter: $filter, sort: $sort, first: $first, after: $after) {
              total
              pageInfo {
                hasNextPage
                endCursor
              }
              edges {
                node {
                  id
                  status
                  failureCode
                  failureReason
                  resolution
                  resolutionSummary
                  notes
                  createdAt
                  updatedAt
                  failureAt
                  closedAt
                  automation {
                    id
                    name
                  }
                }
              }
            }
          }
        }
      }
      ... on AspectElement {
        health {
          automations {
            interventions(filter: $filter, sort: $sort, first: $first, after: $after) {
              total
              pageInfo {
                hasNextPage
                endCursor
              }
              edges {
                node {
                  id
                  status
                  failureCode
                  failureReason
                  resolution
                  resolutionSummary
                  notes
                  createdAt
                  updatedAt
                  failureAt
                  closedAt
                  automation {
                    id
                    name
                  }
                }
              }
            }
          }
        }
      }
      ... on AspectTask {
        health {
          automations {
            interventions(filter: $filter, sort: $sort, first: $first, after: $after) {
              total
              pageInfo {
                hasNextPage
                endCursor
              }
              edges {
                node {
                  id
                  status
                  failureCode
                  failureReason
                  resolution
                  resolutionSummary
                  notes
                  createdAt
                  updatedAt
                  failureAt
                  closedAt
                  automation {
                    id
                    name
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

