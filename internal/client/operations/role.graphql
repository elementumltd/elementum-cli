# Role and Access Policy queries

query GetRoleByID($aspectId: ID!, $roleId: ID!) {
  organization {
    aspect(id: $aspectId) {
      __typename
      ... on AspectApp {
        role(id: $roleId) {
          id
          name
          description
          autoShare
          managed
          tags
          permissions {
            edges {
              node {
                permission
                description
                group {
                  group
                  name
                }
                level {
                  level
                  name
                }
              }
            }
          }
          permissionsV2 {
            edges {
              node {
                group {
                  group
                  name
                }
                level {
                  level
                  name
                }
                assignedPermissions {
                  permission
                  description
                }
              }
            }
          }
          users(first: 1000) {
            edges {
              node {
                id
              }
            }
          }
          groups(first: 1000) {
            edges {
              node {
                id
              }
            }
          }
        }
      }
      ... on AspectElement {
        role(id: $roleId) {
          id
          name
          description
          autoShare
          managed
          tags
          permissions {
            edges {
              node {
                permission
                description
                group {
                  group
                  name
                }
                level {
                  level
                  name
                }
              }
            }
          }
          permissionsV2 {
            edges {
              node {
                group {
                  group
                  name
                }
                level {
                  level
                  name
                }
                assignedPermissions {
                  permission
                  description
                }
              }
            }
          }
          users(first: 1000) {
            edges {
              node {
                id
              }
            }
          }
          groups(first: 1000) {
            edges {
              node {
                id
              }
            }
          }
        }
      }
    }
  }
}

query GetRoles($aspectId: ID!, $filter: Filter) {
  organization {
    aspect(id: $aspectId) {
      __typename
      ... on AspectApp {
        roles(filter: $filter, first: 1000) {
          edges {
            node {
              id
              name
              description
              autoShare
              managed
              tags
              permissionsV2 {
                edges {
                  node {
                    group {
                      group
                      name
                    }
                    level {
                      level
                      name
                    }
                  }
                }
              }
              users {
                total
              }
              groups {
                total
              }
            }
          }
        }
      }
      ... on AspectElement {
        roles(filter: $filter, first: 1000) {
          edges {
            node {
              id
              name
              description
              autoShare
              managed
              tags
              permissionsV2 {
                edges {
                  node {
                    group {
                      group
                      name
                    }
                    level {
                      level
                      name
                    }
                  }
                }
              }
              users {
                total
              }
              groups {
                total
              }
            }
          }
        }
      }
    }
  }
}

