# Fragment for action execution with inputs/outputs
fragment ActionExecutionWithIO on ActionExecution {
  id
  type
  status
  duration
  startedAt
  completedAt
  error {
    reason
  }
  action {
    id
    name
    __typename
  }
  inputsOutputs {
    inputs
    outputs
  }
}

# Query for execution with detailed action I/O - routes through aspect for permissions
query GetAutomationExecutionWithActionIO(
  $aspectId: ID!
  $automationId: ID!
  $executionId: ID!
  $first: Int
  $after: String
) {
  organization {
    aspect(id: $aspectId) {
      id
      automation(id: $automationId) {
        id
        name
        execution(id: $executionId) {
          id
          status
          startedAt
          completedAt
          duration
          version
          errors
          actions(first: $first, after: $after) {
            total
            pageInfo {
              endCursor
              hasNextPage
            }
            edges {
              node {
                ...ActionExecutionWithIO
              }
            }
          }
          failedAction {
            ...ActionExecutionWithIO
          }
        }
      }
    }
  }
}

# ==============================================================================
# Two-Phase Automation Discovery Queries
# ==============================================================================
# Phase 1: Get lightweight automation list with just workflow IDs
# Phase 2: Fetch each workflow's details individually to avoid timeouts
# ==============================================================================

# Phase 1: Lightweight query to get automations with just workflow IDs
# This query is fast because it doesn't fetch triggers/tasks
query GetAutomationsList($aspectId: ID!, $filter: Filter) {
  organization {
    aspect(id: $aspectId) {
      id
      ... on AspectApp {
        automations(filter: $filter) {
          edges {
            node {
              id
              name
              status
              current {
                id
              }
              draft {
                id
              }
            }
          }
        }
      }
      ... on AspectElement {
        automations(filter: $filter) {
          edges {
            node {
              id
              name
              status
              current {
                id
              }
              draft {
                id
              }
            }
          }
        }
      }
    }
  }
}

# Phase 2: Fetch a single workflow's full details via aspect.workflow(id)
# This is called once per workflow to spread the load
query GetWorkflowDetailsForDiscovery($aspectId: ID!, $workflowId: ID!) {
  organization {
    aspect(id: $aspectId) {
      id
      workflow(id: $workflowId) {
        id
        triggers {
          ...DiscoveryTriggerFields
        }
        tasks {
          ...DiscoveryTaskFields
        }
      }
    }
  }
}

# ==============================================================================
# CLI Visualization Queries
# ==============================================================================
# Query for rendering automation flow in CLI/HTML with nested switch/for_each
# ==============================================================================

# Fragment for basic task info (used in nested children)
fragment CLITaskBasic on WorkflowTask {
  id
  __typename
  name
  previous { id }
  next { id }
}

# Query for CLI automation visualization - fetches workflow structure with nested children
query GetWorkflowForVisualization($workflowId: ID!) {
  organization {
    workflow(id: $workflowId) {
      id
      name
      version
      status
      terminal
      triggers {
        id
        __typename
        ... on WorkflowRecordCreateTrigger {
          filter
        }
        ... on WorkflowRecordUpdateTrigger {
          filter
          changedFields { id name }
        }
        ... on WorkflowOnDemandTrigger {
          showTriggeredBy
          parameters { id name fieldType required }
        }
        ... on WorkflowWebhookTrigger {
          authenticated
          url
        }
        ... on WorkflowTemporalTrigger {
          temporalUnit
          value
        }
      }
      tasks {
        ...CLITaskBasic
        ... on WorkflowSwitchTask {
          children {
            id
            label
            filter
            tasks {
              ...CLITaskBasic
              ... on WorkflowSwitchTask {
                children {
                  id
                  label
                  tasks { ...CLITaskBasic }
                }
              }
              ... on WorkflowForEachTask {
                forEach { id label value }
                children {
                  id
                  tasks { ...CLITaskBasic }
                }
              }
            }
          }
        }
        ... on WorkflowForEachTask {
          forEach { id label value }
          children {
            id
            tasks {
              ...CLITaskBasic
              ... on WorkflowSwitchTask {
                children {
                  id
                  label
                  tasks { ...CLITaskBasic }
                }
              }
              ... on WorkflowForEachTask {
                forEach { id label value }
                children {
                  id
                  tasks { ...CLITaskBasic }
                }
              }
            }
          }
        }
      }
      outputs {
        name
      }
    }
  }
}

# ==============================================================================
# Progressive Disclosure Execution Queries (Two-Phase)
# ==============================================================================
# Fast query for execution metadata without I/O (default)
# Separate query for fetching individual action I/O on demand
# ==============================================================================

# Fragment for action execution metadata without inputs/outputs (fast)
fragment ActionExecutionMetadata on ActionExecution {
  id
  type
  status
  duration
  startedAt
  completedAt
  error {
    reason
  }
  action {
    id
    name
    __typename
  }
}

# Fast query for execution metadata - no I/O data (default for CLI)
query GetAutomationExecutionMetadata(
  $aspectId: ID!
  $automationId: ID!
  $executionId: ID!
  $first: Int
  $after: String
) {
  organization {
    aspect(id: $aspectId) {
      id
      automation(id: $automationId) {
        id
        name
        execution(id: $executionId) {
          id
          status
          startedAt
          completedAt
          duration
          version
          errors
          actions(first: $first, after: $after) {
            total
            pageInfo {
              endCursor
              hasNextPage
            }
            edges {
              node {
                ...ActionExecutionMetadata
              }
            }
          }
          failedAction {
            ...ActionExecutionMetadata
          }
        }
      }
    }
  }
}

# Query for fetching a single action's I/O data on demand
query GetActionExecutionIO(
  $aspectId: ID!
  $automationId: ID!
  $executionId: ID!
  $actionId: ID!
) {
  organization {
    aspect(id: $aspectId) {
      id
      automation(id: $automationId) {
        id
        execution(id: $executionId) {
          action(id: $actionId) {
            id
            inputsOutputs {
              inputs
              outputs
            }
          }
        }
      }
    }
  }
}

# Discovery query - uses first: 1000 to match frontend behavior
query GetAspectAutomationsForDiscovery($aspectId: ID!, $filter: Filter) {
  organization {
    aspect(id: $aspectId) {
      id
      ... on AspectApp {
        automations(filter: $filter, first: 1000) {
          edges {
            node {
              id
              name
              status
              current {
                id
                triggers {
                  ...DiscoveryTriggerFields
                }
                tasks {
                  ...DiscoveryTaskFields
                }
              }
              draft {
                id
              }
            }
          }
        }
      }
      ... on AspectElement {
        automations(filter: $filter, first: 1000) {
          edges {
            node {
              id
              name
              status
              current {
                id
                triggers {
                  ...DiscoveryTriggerFields
                }
                tasks {
                  ...DiscoveryTaskFields
                }
              }
              draft {
                id
              }
            }
          }
        }
      }
    }
  }
}

# Get automations and agents that depend on this automation
query GetAutomationDependencies($automationId: ID!) {
  organization {
    automation(id: $automationId) {
      id
      name
      usage {
        automations {
          edges {
            node {
              id
              name
            }
          }
        }
        agents {
          edges {
            node {
              id
              name
            }
          }
        }
        agentTools {
          edges {
            node {
              id
              name
            }
          }
        }
      }
    }
  }
}
