# Relationship (AutoRelation) queries

query GetAutoRelation($id: ID!) {
  organization {
    autoRelation(id: $id) {
      id
      filter
      aspect {
        id
        name
      }
      columns {
        aspectField {
          id
          name
        }
        relatedAspectTableField {
          __typename
          ... on AspectField {
            aspectFieldId: id
            aspectFieldName: name
          }
          ... on TableField {
            tableFieldId: id
            tableFieldName: name
          }
        }
      }
      # @genqlient(typename: "AutoRelationTarget")
      relatedAspectTable {
        __typename
        ... on AspectApp {
          appId: id
          appName: name
        }
        ... on AspectElement {
          elementId: id
          elementName: name
        }
        ... on AspectTask {
          taskId: id
          taskName: name
        }
        ... on Table {
          tableId: id
          tableName: name
        }
      }
    }
  }
}

query GetAspectAutoRelations($aspectId: ID!) {
  organization {
    aspect(id: $aspectId) {
      id
      autoRelations {
        edges {
          node {
            id
            filter
            aspect {
              id
              name
            }
            columns {
              aspectField {
                id
                name
              }
              relatedAspectTableField {
                __typename
                ... on AspectField {
                  aspectFieldId: id
                  aspectFieldName: name
                }
                ... on TableField {
                  tableFieldId: id
                  tableFieldName: name
                }
              }
            }
            # @genqlient(typename: "AutoRelationListTarget")
            relatedAspectTable {
              __typename
              ... on AspectApp {
                appId: id
                appName: name
              }
              ... on AspectElement {
                elementId: id
                elementName: name
              }
              ... on AspectTask {
                taskId: id
                taskName: name
              }
              ... on Table {
                tableId: id
                tableName: name
              }
            }
          }
        }
      }
    }
  }
}
