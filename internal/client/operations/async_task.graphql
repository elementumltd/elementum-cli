# Async Task polling queries for search table creation

# Get an async task by ID for polling status
# Used to wait for search table creation to complete
# Note: asyncTask is accessed via the current user (me)
# Note: We use aliases (aspectSearchTable, tableSearchTable) because the field types differ
query GetAsyncTask($id: ID!) {
  me {
    asyncTask(id: $id) {
      id
      status
      errors
      completedAt
      name
      ... on AsyncTaskSearchTableCreate {
        aspectSearchTable: searchTable {
          id
          aspectField: field {
            id
            name
          }
        }
      }
      ... on AsyncTaskTableSearchTableCreate {
        tableSearchTable: searchTable {
          id
          tableField: field {
            id
            name
          }
        }
      }
      ... on AsyncTaskAspectPromotion {
        aspect {
          ... on AspectApp {
            id
            name
          }
          ... on AspectElement {
            id
            name
          }
          ... on AspectTask {
            id
            name
          }
        }
        executionId
      }
    }
  }
}