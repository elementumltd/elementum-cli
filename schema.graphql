  id: ID!
  agents(after: String, before: String, filter: Filter, first: Int, last: Int, sort: Sort): AgentV2Connection!

  """
  FILTERING
  "filter":{
      "field":"level",
      "type":"EQUALS",
      "value":{
          "type":"NUMBER",
          "value":0
      }
  }
  The chain of command can be filtered by level. Level 1 is this employee with every
  level up corresponding to another employee higher up the chain.
  
  SORTING:
  "sort":{
      "orders":[
          {
              "field":"level",
              "direction": "DESC",
              "aggregation":null
          }
      ]
  }
  The chain of command can be sorted by level. Sorting by level DESC will return
  top employee first and ACS will return this employee first.
  """
