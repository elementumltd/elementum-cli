A trigger that listens for emails sent to the specified email alias

Args:
- emailAlias: The email alias that will trigger the workflow

Trigger Properties:
- subject: The subject on the email.
- body: The body of the email.
- bodyHtml: The body of the email in html format.
- fromEmailAddress: The sender's email address
- fromPersonal: The sender's personal name.
- emailAlias: The triggered email's email alias.
- emailSubAddress: The triggered email's sub-address (+ addressing).

Returns:
The email ingestion trigger. Workflows can have multiple email ingestion triggers but
should not contain triggers of other types.
"""
