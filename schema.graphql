type SnowflakeTableInfo {
  """
  If Automatic Clustering is enabled for your account, specifies whether it is
  explicitly enabled (ON) or disabled (OFF) for the table. This column is not
  displayed if Automatic Clustering is not enabled for your account.
  """
  automaticClustering: Boolean

  """
  change tracking is enabled. You can query this change tracking data using
  streams or the CHANGES clause for SELECT statements. If OFF, change tracking
  is currently disabled but could be enabled.
  """
  changeTracking: Boolean

  """
  if the table has schema evolution enabled You can enable automatic table
  schema evolution by using the CREATE TABLE or ALTER TABLE commands.
  """
  enableSchemaEvolution: Boolean

  """if it is an event table"""
  isEvent: Boolean

  """if it is an external table"""
  isExternal: Boolean

  """Table type: TABLE (for permanent tables), TEMPORARY, or TRANSIENT."""
  kind: String

  """Role that owns the table."""
  owner: String

  """
  The type of role that owns the object, either ROLE or DATABASE_ROLE. Note that
  Snowflake returns NULL if you delete the object because there is no owner role
  for a deleted object.
  """
  ownerRoleType: String

  """
  Number of days that modified and deleted data is retained for Time Travel.
  """
  retentionTime: String

  """the table has the search optimization service enabled"""
  searchOptimization: Boolean

  """
  Number of additional bytes of storage that the search optimization service consumes for this table.
  """
  searchOptimizationBytes: Float

  """
  Percentage of the table that has been optimized for search. This value
  increases when optimization is first added to a table and when maintenance is
  done on the search optimization service. Before you measure the performance
  improvement of search optimization on a newly-optimized table, wait until this
  shows that the table has been fully optimized.
  """
  searchOptimizationProgress: Float
}

