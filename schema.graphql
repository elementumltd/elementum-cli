  """
  Executes a calculated field completion request to the AI service using the specified parameters.
  
  Args:
  - aspectId: The identifier of the calculated field's Aspect (required).
  - prompt: The prompt text for the model to complete (required).
  - randomness: The randomness of the generated text, between 0 and 1 (Defaults to 0.7).
  
  Returns:
  A completion object whose `response` represents the calculated field expression.
  """
  aiCalculatedFieldCompletionExecute(aspectId: ID!, prompt: String!, randomness: Float): AICompletion!

  """
  Creates a description of the cloud link datasource based on the tables in the datasource.
  
  Args:
  - cloudLinkId: The identifier of the cloud link to generate the cloud link datasource description (required).
  - datasourceId: The identifier of the datasource to use to generate the cloud link datasource description (required).
  - randomness: The randomness of the generated text, between 0 and 1 (Defaults to 0.7).
  
  Returns:
  A completion object whose `response` represents the description of the cloud link datasource.
  """
  aiCloudLinkDatasourceDescriptionCompletionExecute(aspectId: ID, cloudLinkId: ID!, datasourceId: ID!, randomness: Float): AICompletion!

  """
  Executes a completion request to the AI service using the specified parameters.
  
  Args:
  - prompt: The prompt text for the model to complete (required).
  - randomness: The randomness of the generated text, between 0 and 1 (Defaults to 0.7).
  
  Returns:
  A completion object whose `response` represents the completed text generated by the AI service.
  """
  aiCompletionExecute(aspectId: ID, prompt: String!, randomness: Float): AICompletion!

  """
  Executes an email analysis completion request to the AI service using the specified parameters.
  
  Args:
  - subject: The subject text of an email.
  - body: The body text of an email (required).
  - randomness: The randomness of the generated text, between 0 and 1 (Defaults to 0.7).
  
  Returns:
  A completion object containing the analysis information generated by the AI service.
  """
